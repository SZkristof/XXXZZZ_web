name: Build & deploy to Rackhost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerates the Hungarian font subsets so deployed files always match
      # the installed font version.
      - name: Install font tooling
        run: pip install fonttools brotli

      - name: Subset fonts
        run: ./scripts/subset-fonts.sh

      # SITE_ENV decides two things at once: whether this deploy may be
      # indexed, and whether the invented testimonials are tolerated.
      #
      #   staging (default) -> noindex + robots Disallow: /, placeholders OK
      #   production        -> indexable, and build:prod REFUSES to build
      #                        while src/data/proof.ts holds invented reviews
      #
      # It defaults to staging, so a forgotten setting yields an un-indexed
      # site rather than fabricated testimonials indexed on the real domain.
      - name: Announce target
        run: |
          ENV="${{ vars.SITE_ENV || 'staging' }}"
          echo "::notice title=Deploy target::SITE_ENV=$ENV"
          if [ "$ENV" = "production" ]; then
            echo "=== PRODUCTION: indexable, real testimonials required ==="
          else
            echo "=== STAGING: noindex + robots Disallow: / ==="
            echo "Set the repository variable SITE_ENV=production to go live."
          fi

      - name: Build
        env:
          PUBLIC_NOINDEX: ${{ vars.SITE_ENV == 'production' && '0' || '1' }}
        run: |
          if [ "${{ vars.SITE_ENV }}" = "production" ]; then
            npm run build:prod
          else
            npm run build
          fi

      # Proves the consent banner still gates tracking correctly before
      # anything reaches production.
      # Catches renamed routes and stale asset references before they ship.
      - name: Verify internal links
        run: npm run verify:links

      # One browser install serves both the contrast and consent checks.
      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium

      # Measures real rendered contrast. A token migration can leave light
      # text on a light ground: the build passes and the text is invisible.
      - name: Verify text contrast
        run: npm run verify:contrast

      - name: Verify GDPR consent behaviour
        run: npm run verify:consent

      # Exercises the PHP handler: validation, honeypot, rate limit, CRLF
      # stripping, and that leads land outside the web root.
      - name: Verify contact form handler
        run: npm run verify:form

      # --- Deploy. Rackhost may offer SFTP or FTPS only; set the repository
      # variable DEPLOY_PROTOCOL to "sftp" or "ftps" to pick one. -------------
      # SFTP is the default: the Tárhely Mini package exposes SSH, so the
      # transfer is encrypted and we never send a password in clear text.
      # An SSH key is preferred; DEPLOY_PASSWORD is the fallback.
      - name: Deploy over SFTP
        if: vars.DEPLOY_PROTOCOL != 'ftps'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          ssh_private_key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.DEPLOY_REMOTE_PATH }}
          sftp_only: true
          # Server-side files the build does not produce must survive a deploy:
          # api/config.local.php holds the SMTP credentials, api/_leads holds
          # captured leads.
          delete_remote_files: false

      # The step above expands './dist/*' as a glob, and a glob does not match
      # dotfiles — so .htaccess was silently left behind on every deploy. That
      # file carries the 404 page, the HTTPS and www redirects, the cache and
      # security headers, and the directory-listing block, so its absence is
      # invisible until you hit a 404 or audit the headers. Uploaded explicitly.
      - name: Deploy .htaccess (dotfiles are not matched by the glob above)
        if: vars.DEPLOY_PROTOCOL != 'ftps' && vars.DEPLOY_PROTOCOL != 'ftp'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          ssh_private_key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          local_path: './dist/.htaccess'
          remote_path: ${{ secrets.DEPLOY_REMOTE_PATH }}
          sftp_only: true
          delete_remote_files: false

      # Fallback for a host without usable SSH. DEPLOY_PROTOCOL selects the
      # flavour, because FTP servers differ in what they accept:
      #   ftps         explicit TLS on port 21 (AUTH TLS) — preferred
      #   ftps-legacy  implicit TLS on port 990 — older servers only do this
      #   ftp          NO ENCRYPTION; the password crosses the network in
      #                clear text. Last resort, and a deliberate choice.
      - name: Deploy over FTP
        if: vars.DEPLOY_PROTOCOL != 'sftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 21 }}
          protocol: ${{ vars.DEPLOY_PROTOCOL }}
          local-dir: ./dist/
          server-dir: ${{ secrets.DEPLOY_REMOTE_PATH }}
          # Never touch server-side files the build does not produce.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/config.local.php
            api/_leads/**
            _private/**
