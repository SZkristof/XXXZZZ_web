name: Build & deploy to Rackhost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerates the Hungarian font subsets so deployed files always match
      # the installed font version.
      - name: Install font tooling
        run: pip install fonttools brotli

      - name: Subset fonts
        run: ./scripts/subset-fonts.sh

      # Refuses to build while src/data/proof.ts still holds invented
      # testimonials. Remove this step only once real proof is in place.
      - name: Build (blocks on placeholder testimonials)
        run: npm run build:prod

      # Proves the consent banner still gates tracking correctly before
      # anything reaches production.
      # Catches renamed routes and stale asset references before they ship.
      - name: Verify internal links
        run: npm run verify:links

      - name: Verify GDPR consent behaviour
        run: |
          npx playwright install --with-deps chromium
          npm run verify:consent

      # Exercises the PHP handler: validation, honeypot, rate limit, CRLF
      # stripping, and that leads land outside the web root.
      - name: Verify contact form handler
        run: npm run verify:form

      # --- Deploy. Rackhost may offer SFTP or FTPS only; set the repository
      # variable DEPLOY_PROTOCOL to "sftp" or "ftps" to pick one. -------------
      # SFTP is the default: the Tárhely Mini package exposes SSH, so the
      # transfer is encrypted and we never send a password in clear text.
      # An SSH key is preferred; DEPLOY_PASSWORD is the fallback.
      - name: Deploy over SFTP
        if: vars.DEPLOY_PROTOCOL != 'ftps'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          ssh_private_key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.DEPLOY_REMOTE_PATH }}
          sftp_only: true
          # Server-side files the build does not produce must survive a deploy:
          # api/config.local.php holds the SMTP credentials, api/_leads holds
          # captured leads.
          delete_remote_files: false

      # Fallback only, for a host without SSH. Set DEPLOY_PROTOCOL=ftps.
      - name: Deploy over FTPS
        if: vars.DEPLOY_PROTOCOL == 'ftps'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 21 }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.DEPLOY_REMOTE_PATH }}
          # Never touch server-side files the build does not produce.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/config.local.php
            api/_leads/**
            _private/**
